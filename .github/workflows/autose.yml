name: AutoSE issue workflow

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  authorize:
    if: github.repository == 'AKGIIITH/markdown'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      issue: ${{ steps.authorize.outputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - id: authorize
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          issue=$(python -m workflow.trigger --event-file "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --actor "$GITHUB_ACTOR")
          printf 'issue=%s\n' "$issue" >> "$GITHUB_OUTPUT"

  plan-build:
    needs: authorize
    if: needs.authorize.outputs.issue != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: autose-build-${{ needs.authorize.outputs.issue }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Prepare public issue input
        run: |
          python -m workflow.trigger --event-file "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --actor "$GITHUB_ACTOR" --issue-out "$RUNNER_TEMP/issue.md"
          test -s "$RUNNER_TEMP/issue.md"
      - name: Run model stages
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ISSUE: ${{ needs.authorize.outputs.issue }}
          BUDGET: ${{ vars.AUTOSE_PROVIDER_BUDGET }}
          REQUIREMENTS_CAP: ${{ vars.AUTOSE_REQUIREMENTS_CAP }}
          DESIGN_CALLS: ${{ vars.AUTOSE_DESIGN_CALLS }}
          DESIGN_CAP: ${{ vars.AUTOSE_DESIGN_CAP }}
          DESIGN_FINAL_CAP: ${{ vars.AUTOSE_DESIGN_FINAL_CAP }}
          IMPLEMENTATION_CAP: ${{ vars.AUTOSE_IMPLEMENTATION_CAP }}
          TESTING_CAP: ${{ vars.AUTOSE_TESTING_CAP }}
        run: |
          python -m workflow.controller --issue "$ISSUE" --issue-file "$RUNNER_TEMP/issue.md" \
            --out "$RUNNER_TEMP/autose-model" --live --skill workflow/skills/requirements.md \
            --budget-confirmation "$BUDGET" --requirements-cap "$REQUIREMENTS_CAP" --design-calls "$DESIGN_CALLS" \
            --design-cap "$DESIGN_CAP" --design-final-cap "$DESIGN_FINAL_CAP" \
            --implementation-cap "$IMPLEMENTATION_CAP" --testing-cap "$TESTING_CAP"
      - name: Collect the test handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, shutil
          temp = Path(os.environ["RUNNER_TEMP"])
          controller, = (temp / "autose-model").glob("*-controller-*")
          gate = json.loads((controller / "gate.json").read_text())
          assert gate["outcome"] == "ready_for_test_runner"
          builder = Path(gate["artifact"]).resolve()
          assert builder.is_relative_to(controller.resolve())
          out = temp / "autose-test-input"
          out.mkdir()
          for name in ("manifest.json", "gate.json", "diff.patch", "public-tests.py"):
              shutil.copyfile(builder / name, out / name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autose-model-evidence
          path: |
            ${{ runner.temp }}/autose-model/*/*.json
            ${{ runner.temp }}/autose-model/*/*.log
            ${{ runner.temp }}/autose-model/*/*/*.json
            ${{ runner.temp }}/autose-model/*/*/*.jsonl
            ${{ runner.temp }}/autose-model/*/*/*.txt
            ${{ runner.temp }}/autose-model/*/*/*.md
      - uses: actions/upload-artifact@v4
        with:
          name: autose-test-input
          path: ${{ runner.temp }}/autose-test-input

  test:
    needs: [authorize, plan-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: autose-test-input
          path: ${{ runner.temp }}/autose-test-input
      - name: Install declared test dependencies
        run: |
          sudo apt-get install libtidy-dev
          python -m pip install '.[testing]' pytidylib
      - name: Verify public tests and candidate suite
        env:
          ISSUE: ${{ needs.authorize.outputs.issue }}
        run: |
          python -m workflow.pilot --issue "$ISSUE" check \
            --builder-run "$RUNNER_TEMP/autose-test-input" --out "$RUNNER_TEMP/autose-public-tests"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autose-public-test-evidence
          path: |
            ${{ runner.temp }}/autose-public-tests/*/*.json
            ${{ runner.temp }}/autose-public-tests/*/*.jsonl
            ${{ runner.temp }}/autose-public-tests/*/*.log
            ${{ runner.temp }}/autose-public-tests/*/*.md
            ${{ runner.temp }}/autose-public-tests/*/diff.patch
      - name: Collect the passed Testing handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, shutil
          temp = Path(os.environ["RUNNER_TEMP"])
          testing, = (temp / "autose-public-tests").glob("*-public-testing-replay-*")
          assert json.loads((testing / "gate.json").read_text())["outcome"] == "passed"
          out = temp / "autose-release-input"
          out.mkdir()
          for name in ("manifest.json", "gate.json", "diff.patch"):
              shutil.copyfile(testing / name, out / name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: autose-release-input
          path: ${{ runner.temp }}/autose-release-input

  release-preflight:
    needs: [authorize, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: autose-release-input
          path: ${{ runner.temp }}/autose-release-input
      - name: Reconstruct the exact tested candidate
        env:
          ISSUE: ${{ needs.authorize.outputs.issue }}
        run: |
          python -m workflow.release --issue "$ISSUE" \
            --test-run "$RUNNER_TEMP/autose-release-input" --out "$RUNNER_TEMP/autose-release"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autose-release-preflight
          path: ${{ runner.temp }}/autose-release
